
<!DOCTYPE html>
<html>
<head>
    <title>Farmer Registration | AgroVision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card mx-auto p-4 shadow" style="max-width:600px">
        <h2 class="text-success text-center">Farmer Registration</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            {{ form.errors }}
            <button class="btn btn-success w-100">Register</button>
        </form>
        <p class="mt-3 text-center">
            Already registered?
            <a href="{% url 'farmer_login' %}">Login</a>
        </p>
    </div>
</div>
</body>
</html>
