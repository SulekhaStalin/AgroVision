
<!DOCTYPE html>
<html>
<head>
    <title>Farmer Login | AgroVision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card mx-auto p-4 shadow" style="max-width:450px">
        <h2 class="text-success text-center">Farmer Login</h2>

        {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            <input name="username" class="form-control mb-3"
                   placeholder="Username" required>

            <input name="password" type="password"
                   class="form-control mb-3"
                   placeholder="Password" required>

            <button class="btn btn-success w-100">Login</button>
        </form>

        <p class="mt-3 text-center">
            New farmer?
            <a href="{% url 'farmer_register' %}">Register</a>
        </p>
    </div>
</div>
</body>
</html>
